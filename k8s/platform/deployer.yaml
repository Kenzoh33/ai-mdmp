# Deployer in the cluster. It runs in mdmp-platform but manages objects in mdmp-models,
# so its Role and RoleBinding live in mdmp-models and the subject points back to mdmp-platform.
# DATABASE_URL comes from the deployer-db Secret, e.g.:
#   kubectl -n mdmp-platform create secret generic deployer-db \
#     --from-literal=DATABASE_URL=postgresql+psycopg://USER:PASS@postgres:5432/mdmp
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: mdmp-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: mdmp-models
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "deployments/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: mdmp-models
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: mdmp-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployer
  namespace: mdmp-platform
  labels:
    app: deployer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployer
  template:
    metadata:
      labels:
        app: deployer
    spec:
      serviceAccountName: deployer
      containers:
        - name: deployer
          image: ai-mdmp-deployer:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: IN_CLUSTER
              value: "true"
            - name: MODELS_NAMESPACE
              value: mdmp-models
            - name: MODEL_IMAGE_TEMPLATE
              value: "ai-mdmp-{model}:{version}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deployer-db
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: deployer
  namespace: mdmp-platform
spec:
  selector:
    app: deployer
  ports:
    - name: http
      port: 8000
      targetPort: http
