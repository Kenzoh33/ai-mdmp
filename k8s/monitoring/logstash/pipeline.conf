input {
  http {
    port => 8080
    codec => plain
    additional_codecs => {
      "application/json" => "plain"
    }
  }
}

filter {
  json {
    source => "message"
  }
}

output {
  elasticsearch {
    hosts => ["http://ai-mdmp-elasticsearch:9200"]
    index => "ai-mdmp-logs"
    ilm_enabled => false
  }

  stdout {
    codec => rubydebug
  }
}