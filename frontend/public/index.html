<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-MDMP Dashboard</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQuery 3.7 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">AI-MDMP</span>
            <span class="badge bg-success" id="connection-status">Connected</span>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Notification Area -->
        <div id="notification-area"></div>

        <!-- Navigation Tabs -->
        <ul class="nav nav-tabs" id="dashboardTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="deployments-tab" data-bs-toggle="tab" data-bs-target="#deployments" type="button" role="tab">Deployments</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="logs-tab" data-bs-toggle="tab" data-bs-target="#logs" type="button" role="tab">Logs</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="insights-tab" data-bs-toggle="tab" data-bs-target="#insights" type="button" role="tab">AI Insights</button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content border border-top-0 bg-white p-4" id="dashboardTabsContent">
            <!-- Deployments Tab -->
            <div class="tab-pane fade show active" id="deployments" role="tabpanel">
                <h4>New Deployment</h4>
                <form id="deploy-form" class="row g-2 align-items-end mb-4">
                    <div class="col-auto">
                        <label class="form-label" for="deploy-version">Version</label>
                        <select class="form-select" id="deploy-version">
                            <option value="v1">v1</option>
                            <option value="v2">v2</option>
                            <option value="v3">v3</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <label class="form-label" for="deploy-strategy">Strategy</label>
                        <select class="form-select" id="deploy-strategy">
                            <option value="full">full</option>
                            <option value="canary">canary</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <label class="form-label" for="deploy-weight">Canary weight %</label>
                        <input type="number" class="form-control" id="deploy-weight" min="0" max="100" value="20">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary" id="btn-deploy">Deploy</button>
                    </div>
                </form>
                <h4>Active Deployments</h4>
                <div id="deployments-list" class="mt-3">Loading deployments...</div>
            </div>

            <!-- Logs Tab -->
            <div class="tab-pane fade" id="logs" role="tabpanel">
                <h4>System Logs</h4>
                <div class="bg-dark text-light p-3 rounded" style="height: 300px; overflow-y: auto;" id="logs-container">
                    Waiting for logs...
                </div>
            </div>

            <!-- AI Insights Tab -->
            <div class="tab-pane fade" id="insights" role="tabpanel">
                <h4>Deployment Strategy & Insights</h4>
                <button class="btn btn-primary" id="btn-suggest-plan">Suggest Rollout Plan</button>
                <div id="insights-container" class="mt-3 p-3 border rounded bg-light">
                    No insights generated yet.
                </div>
            </div>
        </div>
    </div>

    <!-- Custom App Script -->
    <script src="js/app.js"></script>
</body>
</html>
